<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Request | VISUTRA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1B16;--paprika:#C1440E;--indigo:#2E4374;--ivory:#F7F1E3;--thread:#E4D8BD;--muted:#6B6255;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--ivory);color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .top a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700}
  .top img{height:28px;width:auto}
  .top .user{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .top .user button{font:inherit;border:1px solid var(--thread);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
  .order-card{background:#fff;border:1px solid var(--thread);border-radius:14px;padding:32px}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--ivory);color:var(--muted);margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
  .box h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
  .box p{margin:0;font-size:14px;line-height:1.5}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--thread)}
  th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted)}
  .note{margin-top:20px;padding:14px 16px;background:var(--ivory);border-radius:10px;font-size:13.5px}
  .loading,.errbox{text-align:center;padding:60px 20px;color:var(--muted)}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../index.html"><img src="../assets/logo.png" alt="VISUTRA"></a>
    <div class="user" id="userBox"></div>
  </div>
  <div id="content" class="loading">Checking your sign-in…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(order, user){
  document.getElementById('userBox').innerHTML = `${esc(user.email)} <button onclick="auth.signOut()">Sign out</button>`;
  const items = (order.items||[]).map((li,i) => `<tr>
    <td>${i+1}</td><td>${esc(li.name)}</td><td>${li.qty||0} ${esc(li.unit||'')}</td>
  </tr>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="order-card">
      <span class="badge">Order Request</span>
      <h1>Order for ${esc(order.supplierName)}</h1>
      <p style="color:var(--muted);font-size:13px;margin:0">Dated ${esc(order.date)}</p>

      <div class="grid2">
        <div class="box"><h3>From</h3>
          <p><b>${esc(order.fromBusinessName)}</b><br>${esc(order.fromBusinessAddress||'')}<br>
          ${order.fromBusinessPhone ? 'Phone: '+esc(order.fromBusinessPhone)+'<br>' : ''}${order.fromBusinessEmail ? esc(order.fromBusinessEmail) : ''}</p>
        </div>
        <div class="box"><h3>To (Supplier)</h3>
          <p><b>${esc(order.supplierName)}</b></p>
        </div>
      </div>

      <table>
        <thead><tr><th>#</th><th>Product</th><th>Qty</th></tr></thead>
        <tbody>${items}</tbody>
      </table>

      ${order.note ? `<div class="note"><b>Note:</b> ${esc(order.note)}</div>` : ''}

      <p class="disclaimer">This is a purchase order request, not a GST invoice — pricing and GST will be settled separately when the purchase is recorded.</p>
    </div>
  `;
}

async function loadOrder(user){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const content = document.getElementById('content');
  document.getElementById('userBox').innerHTML = `${esc(user.email)} <a href="app.html" style="text-decoration:none;color:var(--ink);border:1px solid var(--thread);background:#fff;border-radius:999px;padding:6px 14px">Back to Billing</a> <button onclick="auth.signOut()">Sign out</button>`;

  // No order id = show the logged-in supplier's received-order list.
  if(!id){
    content.innerHTML = '<div class="loading">Loading orders received…</div>';
    try{
      const snap = await db.collection('orders').where('supplierEmail','==',user.email).get();
      const orders = snap.docs.map(d => ({id:d.id, ...d.data()}));
      orders.sort((a,b) => (b.date||'').localeCompare(a.date||''));
      const rows = orders.map(o => {
        const products = (o.items||[]).map(li => `${esc(li.name)} (${li.qty||0} ${esc(li.unit||'')})`).join(', ');
        return `<tr><td>${esc(o.date||'')}</td><td>${esc(o.fromBusinessName||'')}</td><td>${products}</td><td><a class="btn small" href="order-receive.html?id=${encodeURIComponent(o.id)}">View</a></td></tr>`;
      }).join('');
      content.innerHTML = `
        <div class="order-card">
          <span class="badge">Free Service · Orders</span>
          <h1>Orders Received</h1>
          <p style="color:var(--muted);font-size:13px;margin:0 0 18px">Purchase order requests addressed to ${esc(user.email)}.</p>
          <table>
            <thead><tr><th>Date</th><th>From</th><th>Products</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="color:var(--muted)">No orders received yet.</td></tr>'}</tbody>
          </table>
        </div>`;
    }catch(err){
      console.error('Orders received load error:', err);
      content.innerHTML = '<div class="errbox">Could not load received orders. Please try again in a moment.</div>';
    }
    return;
  }

  let order;
  try{
    const snap = await db.collection('orders').doc(id).get();
    if(!snap.exists){ content.innerHTML = '<div class="errbox">Order not found.</div>'; return; }
    order = snap.data();
  }catch(err){
    console.error('Order load error:', err);
    const isPermission = err && err.code === 'permission-denied';
    content.innerHTML = `<div class="errbox">
      ${isPermission
        ? `This order isn't addressed to <b>${esc(user.email)}</b>. If you think this is a mistake, ask the sender to check the email saved for you as their supplier, or sign out and sign back in with the correct email.`
        : 'Could not load this order. Please try the link again in a moment, or contact the sender for a fresh copy.'}
    </div>`;
    return;
  }

  try{
    render(order, user);
  }catch(err){
    console.error('Order render error:', err, order);
    content.innerHTML = '<div class="errbox">This order was found, but something on it couldn\'t be displayed. Check the browser console for details, or contact the sender for a fresh copy.</div>';
  }
}
auth.onAuthStateChanged(user => {
  if(!user){
    window.location.href = 'login.html?redirect=' + encodeURIComponent('order-receive.html' + window.location.search);
    return;
  }
  loadOrder(user);
});
</script>
</body>
</html>
