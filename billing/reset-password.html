<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password | VISUTRA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg">
<link href="https://fonts.bunny.net/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/billing.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .wrap{width:100%;max-width:420px}
  .brand{text-align:center;margin-bottom:18px;font-family:var(--display);font-size:22px}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FF5A00">
<link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
<script src="/pwa.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="brand">VISUTRA</div>
  <div class="card" id="resetCard">
    <h2>Set a new password</h2>
    <p class="sub" id="resetIntro">Checking your reset link…</p>
    <div id="resetForm" class="hidden">
      <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" placeholder="At least 6 characters" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Confirm new password</label><input type="password" id="pw2" autocomplete="new-password"></div>
      <button class="btn primary" style="width:100%" id="saveBtn" onclick="savePassword()">Save new password</button>
    </div>
    <p class="msg" id="resetMsg"></p>
    <p style="text-align:center;margin-top:12px"><a href="login.html" style="font-size:13px">Back to sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/vt-firebase-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
/* The "Reset password" email links here. supabase-js reads the one-time
   token from the link and signs the person in for this purpose only; they
   then choose a new password. */
function msg(text, ok){
  const el = document.getElementById('resetMsg');
  el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'error');
}
const linkError = new URLSearchParams(location.hash.slice(1)).get('error_description')
  || new URLSearchParams(location.search).get('error_description');
let shown = false;
auth.onAuthStateChanged(user => {
  if(shown) return;
  shown = true;
  if(user){
    document.getElementById('resetIntro').textContent = `Choose a new password for ${user.email}.`;
    document.getElementById('resetForm').classList.remove('hidden');
  } else {
    document.getElementById('resetIntro').textContent = linkError
      ? `This reset link can't be used: ${linkError.replace(/\+/g, ' ')}.`
      : 'This reset link has expired or was already used.';
    msg('Go back to sign in and click "Forgot password?" to get a new link.', false);
  }
});
async function savePassword(){
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if(a.length < 6){ msg('Password must be at least 6 characters.', false); return; }
  if(a !== b){ msg('Passwords do not match.', false); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try{
    await auth.currentUser.updatePassword(a);
    await auth.signOut();
    document.getElementById('resetForm').classList.add('hidden');
    msg('Password changed. You can now sign in with your new password.', true);
  }catch(err){
    msg('Could not change the password: ' + err.message, false);
    btn.disabled = false;
  }
}
</script>
</body>
</html>
