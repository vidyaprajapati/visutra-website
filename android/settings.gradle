// Google's mirror of Maven Central is listed first: GitHub's shared build machines are often
// rate-limited ("429 Too Many Requests") by repo.maven.apache.org.
pluginManagement {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = "VISUTRA"
include ':app'
