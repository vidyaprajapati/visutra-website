plugins { id 'com.android.application' }

// Signing details come from the workflow (environment variables). Without them the
// build is unsigned — the workflow always provides them.
def ks = System.getenv('VT_KEYSTORE')

android {
    namespace 'in.visutra.app'
    compileSdk 34
    defaultConfig {
        applicationId 'in.visutra.app'          // permanent — must match .well-known/assetlinks.json
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('VT_VERSION_CODE') ?: '1').toInteger()
        versionName '1.0.' + (System.getenv('VT_VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('VT_STORE_PASS')
                keyAlias System.getenv('VT_KEY_ALIAS')
                keyPassword System.getenv('VT_KEY_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
